<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Payment by Ikal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0a0f2c, #000);
      color: #e0e8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 0 25px rgba(93, 0, 255, 0.3);
      backdrop-filter: blur(12px);
      max-width: 420px;
      width: 100%;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #7dd3fc;
      text-shadow: 0 0 10px #38bdf8;
    }
    img {
      width: 240px;
      height: 240px;
      border-radius: 16px;
      object-fit: cover;
      margin: 15px 0 10px;
      box-shadow: 0 0 20px rgba(59,130,246,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .list {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.8em;
    }
    .highlight {
      color: #60a5fa;
      font-weight: 600;
    }
    footer {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 🔹 GANTI LINK DI BAWAH INI DENGAN LINK QR KAMU (contoh: https://files.) -->
    <img src="https://suspicious-plum-v7scy672bf.edgeone.app/IMG_20251109_183055_005.jpg" alt="QRIS">

    <h1>QRIS — Scan untuk Bayar</h1>
    <div class="list">
      💠 <span class="highlight">Dana:</span> 62xxxxx<br>
      🏦 <span class="highlight">SeaBank:</span> 9xxxxx<br>
      💬 <span class="highlight">Lain:</span> 62xx<br>
      📱 <span class="highlight">Lain:</span> 62xxxx
    </div>

    <p style="margin-top:20px; font-size:0.9rem; color:#a5b4fc;">
      Silahkan transfer ke salah satu nomor di atas
    </p>

    <footer>All Payment by <span class="highlight">Ikal</span></footer>
  </div>
</body>
</html>
